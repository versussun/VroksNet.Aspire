openapi: 3.0.3
info:
  title: Sample Books API
  version: 1.0.0
  description: Example REST contract imported into VroksNet by the sample AppHost. Creating a book publishes a books.created event.
paths:
  /api/books:
    post:
      operationId: createBook
      summary: Create a book and publish a book-created event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author]
              properties:
                title:
                  type: string
                author:
                  type: string
            example:
              title: The Example Book
              author: A. Sample
      responses:
        '201':
          description: The created book
          content:
            application/json:
              schema:
                type: object
                required: [id, title, author]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  author:
                    type: string
              example:
                id: book-123
                title: The Example Book
                author: A. Sample
  /api/books/{bookId}:
    get:
      operationId: getBook
      summary: Get a book by ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested book
          content:
            application/json:
              schema:
                type: object
                required: [id, title, author]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  author:
                    type: string
              example:
                id: book-123
                title: The Example Book
                author: A. Sample
